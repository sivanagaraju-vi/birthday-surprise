<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }
    section {
      min-height: 100vh;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1200px;
    }
    section.active { display: flex; }
    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }
    p {
      font-size: 1.1rem;
      max-width: 650px;
      line-height: 1.7;
    }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #fff;
      color: #ff5f9e;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
    .music-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(255,255,255,0.9);
      color: #ff5f9e;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      display: none;
    }
    .hearts span {
      position: fixed;
      bottom: -10px;
      font-size: 20px;
      animation: float 6s linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
    .photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
      max-width: 700px;
    }
    .photos img {
      width: 100%;
      border-radius: 15px;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .photos img:hover { transform: rotateY(180deg); }
    .float3d {
      font-size: 2.4rem;
      font-weight: bold;
      animation: float3d 3s ease-in-out infinite;
    }
    @keyframes float3d {
      0% { transform: translateY(0) rotateX(0deg); }
      50% { transform: translateY(-20px) rotateX(15deg); }
      100% { transform: translateY(0) rotateX(0deg); }
    }
    .card3d {
      width: 260px;
      height: 160px;
      perspective: 1000px;
      margin-top: 30px;
    }
    .card3d-inner {
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.25);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      animation: rotate3d 7s linear infinite;
    }
    @keyframes rotate3d {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

<div class="music-btn" onclick="toggleMusic()">🎵 Music</div>
<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<section class="active">
  <h1>Hey… 💕</h1>
  <p>Ee website oka chinna surprise ✨<br>Nee kosam, nee birthday kosam 💖</p>
  <button onclick="nextPage()">Tap to Begin ✨</button>
</section>

<section>
  <h1 class="float3d">🎂 Happy Birthday ❤️</h1>
  <p><b>15th December</b></p>
  <h2 id="countdown"></h2>
  <button onclick="nextPage()">Next 💖</button>
</section>

<section>
  <h1>💌 From My Heart</h1>
  <p>I want you in every tomorrow of my life ❤️</p>
  <button onclick="nextPage()">Memories 📸</button>
</section>

<section>
  <h1>📸 Our Memories</h1>
  <div class="photos">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
  </div>
  <button onclick="nextPage()">Final ✨</button>
</section>

<section>
  <h1>✨ Once Again…</h1>
  <p>Happy Birthday My Love 🎂❤️<br>— With Love, <b>Shiva</b></p>
  <div class="card3d"><div class="card3d-inner">❤️ Forever Us ❤️</div></div>
</section>

<div class="hearts"></div>

<script>
let pages = document.querySelectorAll("section");
let current = 0;
function nextPage() {
  pages[current].classList.remove("active");
  current++;
  pages[current].classList.add("active");
  document.querySelector(".music-btn").style.display = "block";
}

setInterval(() => {
  const span = document.createElement("span");
  span.innerHTML = "❤️";
  span.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(span);
  setTimeout(() => span.remove(), 6000);
}, 300);

const music = document.getElementById("music");
function toggleMusic() { music.paused ? music.play() : music.pause(); }

const countdownEl = document.getElementById("countdown");
const birthday = new Date("December 15, 2025 00:00:00").getTime();
setInterval(() => {
  const diff = birthday - new Date().getTime();
  if (diff <= 0) { countdownEl.innerHTML = "🎉 It's Your Birthday! 🎉"; return; }
  const d = Math.floor(diff / (1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60))%24);
  const m = Math.floor((diff/(1000*60))%60);
  const s = Math.floor((diff/1000)%60);
  countdownEl.innerHTML = `${d}d ${h}h ${m}m ${s}s to your special day 💖`;
},1000);
</script>

</body>
</html>
